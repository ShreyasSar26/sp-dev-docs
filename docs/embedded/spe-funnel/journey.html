<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPE Journey</title>
  <link rel="stylesheet" href="styles.css" />
  <!--
    Analytics provider scripts — uncomment to activate (same as index.html).
    GA4:      <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
              <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());</script>
    PostHog:  <script>!function(t,e){...posthog snippet...}(document,window.posthog||[]);</script>
    Mixpanel: <script>(function(f,b){...mixpanel snippet...})(document,window.mixpanel||[]);</script>
    Adobe:    <script src="https://cdn1.adoberesources.net/alloy/2.19.2/alloy.min.js"></script>
  -->
  <style>
    .tool-badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; padding: 4px 12px;
      border-radius: 20px; border: 1.5px solid;
    }
    .journey-progress-banner {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 10px 20px; display: flex; align-items: center; gap: 16px;
    }
    .progress-pct { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .progress-track { flex: 1; height: 6px; background: var(--surface-alt); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
    .read-indicator {
      display: flex; align-items: center; gap: 6px; font-size: 13px;
      color: var(--success); font-weight: 600;
    }
    .phase-divider {
      margin: 32px 0 24px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .7px; border-left: 4px solid;
    }
    .step-card-shadow {
      box-shadow: 0 0 0 3px var(--highlight-color, transparent);
      border-radius: var(--radius-md);
      transition: box-shadow .3s;
    }
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; color: var(--text-muted); margin-bottom: 20px;
      transition: color .15s;
    }
    .back-link:hover { color: var(--text-primary); text-decoration: none; }
    .milestone-banner {
      background: linear-gradient(90deg, var(--phase-color, #0078d4) 0%, transparent 100%);
      border-radius: var(--radius-md); padding: 12px 20px; margin-bottom: 24px;
      opacity: 0; transition: opacity .4s; font-size: 14px; font-weight: 600; color: #fff;
    }
    .milestone-banner.visible { opacity: 1; }
    .doc-preview-frame {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 20px; margin-top: 24px;
      display: flex; gap: 16px; align-items: flex-start;
    }
    .doc-preview-icon {
      width: 44px; height: 44px; border-radius: 8px; background: var(--developer-light);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .doc-preview-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .doc-preview-url { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; word-break: break-all; }
    .related-tools {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px;
    }
  </style>
</head>
<body>

<!-- Top Navigation -->
<nav class="topnav">
  <div class="topnav-inner">
    <div class="topnav-brand">
      <div class="ms-logo">
        <span></span><span></span><span></span><span></span>
      </div>
      SharePoint Embedded
    </div>
    <div class="topnav-links">
      <a href="index.html">Get Started</a>
      <a href="journey.html?persona=developer" id="nav-developer">Developer</a>
      <a href="journey.html?persona=admin" id="nav-admin">IT Admin</a>
      <a href="journey.html?persona=decision-maker" id="nav-dm">Decision Maker</a>
    </div>
  </div>
</nav>

<!-- Journey Progress Banner -->
<div class="journey-progress-banner" id="progress-banner">
  <span class="progress-pct" id="progress-pct">0%</span>
  <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <span id="progress-steps" style="font-size:13px;color:var(--text-muted);white-space:nowrap">0 / 0 steps</span>
</div>

<!-- Journey Layout -->
<div class="journey-wrap" id="journey-wrap">

  <!-- Sidebar -->
  <aside class="journey-sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-persona-badge" id="sidebar-badge"></div>
      <div class="sidebar-progress-bar">
        <div class="sidebar-progress-fill" id="sidebar-progress-fill" style="width:0%"></div>
      </div>
      <div class="sidebar-progress-label" id="sidebar-label">0 of 0 steps complete</div>
    </div>
    <div id="sidebar-nav"></div>
  </aside>

  <!-- Main Content -->
  <main class="journey-main" id="journey-main">
    <div id="step-content"></div>
  </main>

</div>

<script src="data.js"></script>
<script src="analytics.js"></script>
<script>
  // ── Init ─────────────────────────────────────────────────────────────────
  const params = new URLSearchParams(window.location.search);
  const persona = params.get("persona") || "developer";
  const journey = SPE_JOURNEYS[persona];

  if (!journey) {
    document.body.innerHTML = `<div style="padding:40px;text-align:center"><h2>Journey not found.</h2><a href="index.html">Go back</a></div>`;
    throw new Error("Unknown persona: " + persona);
  }

  const COLOR = journey.color;
  const steps = getAllSteps(persona);
  document.title = `SPE ${journey.title} Journey`;
  document.documentElement.style.setProperty("--current-color", COLOR);

  // Highlight active nav link
  const navMap = { developer: "nav-developer", admin: "nav-admin", "decision-maker": "nav-dm" };
  const activeLink = document.getElementById(navMap[persona]);
  if (activeLink) activeLink.classList.add("active");

  // Progress storage key
  const STORAGE_KEY = `spe_progress_${persona}`;

  function getProgress() {
    try { return new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]")); }
    catch { return new Set(); }
  }
  function saveProgress(completedSet) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...completedSet]));
  }

  let completedSteps = getProgress();
  let currentStepIndex = 0;

  // Try to resume at last incomplete step
  for (let i = 0; i < steps.length; i++) {
    if (!completedSteps.has(steps[i].id)) { currentStepIndex = i; break; }
    if (i === steps.length - 1) currentStepIndex = steps.length - 1;
  }

  // ── Sidebar ───────────────────────────────────────────────────────────────
  function renderSidebar() {
    const badge = document.getElementById("sidebar-badge");
    badge.style.background = journey.accentLight;
    badge.style.color = COLOR;
    badge.innerHTML = `${journey.icon} ${journey.title}`;

    const pct = Math.round((completedSteps.size / steps.length) * 100);
    document.getElementById("sidebar-progress-fill").style.width = pct + "%";
    document.getElementById("sidebar-progress-fill").style.background = COLOR;
    document.getElementById("sidebar-label").textContent = `${completedSteps.size} of ${steps.length} steps complete`;

    const nav = document.getElementById("sidebar-nav");
    nav.innerHTML = "";
    let lastPhase = null;

    steps.forEach((step, i) => {
      if (step.phaseName !== lastPhase) {
        nav.innerHTML += `<span class="sidebar-phase-label">${step.phaseName}</span>`;
        lastPhase = step.phaseName;
      }
      const isActive = i === currentStepIndex;
      const isDone = completedSteps.has(step.id);
      nav.innerHTML += `
        <div class="sidebar-step ${isActive ? "active" : ""} ${isDone ? "completed" : ""}"
             onclick="navigateTo(${i})" id="sidebar-step-${i}">
          <div class="step-dot">
            ${isDone ? `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>` : (isActive ? `<div style="width:6px;height:6px;border-radius:50%;background:#fff"></div>` : "")}
          </div>
          <span class="step-label">${step.title}</span>
        </div>`;
    });
  }

  // ── Progress bar ──────────────────────────────────────────────────────────
  function updateProgressBar() {
    const pct = Math.round((completedSteps.size / steps.length) * 100);
    document.getElementById("progress-pct").textContent = pct + "%";
    document.getElementById("progress-fill").style.width = pct + "%";
    document.getElementById("progress-fill").style.background = COLOR;
    document.getElementById("progress-steps").textContent = `${completedSteps.size} / ${steps.length} steps`;
  }

  // ── Tool badge ────────────────────────────────────────────────────────────
  const toolColors = {
    "VS Code": { bg: "#e8f0fe", color: "#1a73e8", border: "#b3cdf8" },
    "Graph API": { bg: "#e3f7e8", color: "#1b6834", border: "#a5d6b0" },
    "Microsoft Entra ID": { bg: "#fde8e8", color: "#a4000d", border: "#f5b3b3" },
    "Azure": { bg: "#e8f2ff", color: "#0062ad", border: "#91caff" },
    "SharePoint Admin Center": { bg: "#fff2e3", color: "#7a3800", border: "#f5caa0" },
    "PowerShell": { bg: "#eae8f5", color: "#3b1d8f", border: "#c5b8f0" },
    "Microsoft Purview": { bg: "#e3f4fd", color: "#005b8e", border: "#9fd6f5" },
    "Azure Portal": { bg: "#e8f2ff", color: "#0062ad", border: "#91caff" }
  };

  function toolBadgeHTML(tool) {
    if (!tool) return "";
    const c = toolColors[tool] || { bg: "#f3f2f1", color: "#605e5c", border: "#e1dfdd" };
    return `<span class="tool-badge" style="background:${c.bg};color:${c.color};border-color:${c.border}">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M4 6l1.5 1.5L8 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      ${tool}
    </span>`;
  }

  // ── Render step ───────────────────────────────────────────────────────────
  function renderStep() {
    if (currentStepIndex >= steps.length) {
      renderCompletion();
      return;
    }

    const step = steps[currentStepIndex];
    const isDone = completedSteps.has(step.id);
    const prevStep = steps[currentStepIndex - 1] || null;
    const nextStep = steps[currentStepIndex + 1] || null;

    // Tag HTML
    const tagHTML = (step.tags || []).map(t => {
      let cls = "";
      if (t === "Required") cls = "required";
      else if (t === "Preview") cls = "preview";
      else if (t === "Optional") cls = "optional";
      return `<span class="tag ${cls}">${t}</span>`;
    }).join("");

    const allTools = journey.phases.flatMap(p => p.steps).filter(s => s.tool).map(s => s.tool);
    const phaseTools = [...new Set(journey.phases.find(ph => ph.name === step.phaseName)?.steps.map(s => s.tool).filter(Boolean) || [])];

    document.getElementById("step-content").innerHTML = `
      <a href="index.html" class="back-link">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8 3L4 7l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back to Start
      </a>

      <span class="step-phase-label" style="color:${step.phaseColor}">${step.phaseName}</span>
      <div class="step-number">Step ${currentStepIndex + 1} of ${steps.length}</div>
      <h1 class="step-title">${step.title}</h1>

      <div class="step-tags">${tagHTML}</div>

      <p class="step-description">${step.description}</p>

      <div class="step-meta">
        <div class="step-meta-item">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 4.5V7l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          ${step.estimatedTime}
        </div>
        ${step.tool ? `<div class="step-meta-item">${toolBadgeHTML(step.tool)}</div>` : ""}
      </div>

      <div class="doc-preview-frame">
        <div class="doc-preview-icon" style="background:${journey.accentLight}">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <path d="M6 2h7l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z" stroke="${COLOR}" stroke-width="1.6"/>
            <path d="M13 2v5h5" stroke="${COLOR}" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M8 10h6M8 14h4" stroke="${COLOR}" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="flex:1">
          <div class="doc-preview-title">${step.title}</div>
          <div class="doc-preview-url">${step.url}</div>
          <a href="${step.url}" target="_blank" rel="noopener" class="btn btn-primary btn-sm" onclick="onDocOpen()">
            Open in Microsoft Learn
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 2h8v8M2 10L10 2" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>
          </a>
        </div>
      </div>

      <div class="step-actions" style="margin-top:24px">
        ${isDone
          ? `<div class="read-indicator">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="var(--success)"/><path d="M5.5 9l2.5 2.5L12.5 6" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Completed
             </div>`
          : `<button class="btn btn-success" onclick="markComplete()">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3.5 3.5 6-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              Mark as Complete
             </button>`
        }
        <button class="btn btn-outline btn-sm" onclick="copyLink()">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8.5 4.5H10A3 3 0 0110 11H8.5M5.5 9.5H4A3 3 0 014 3h1.5M5 7h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Share Link
        </button>
      </div>

      <!-- Navigation -->
      <div class="step-nav">
        <div>
          ${prevStep
            ? `<button class="btn btn-outline" onclick="navigateTo(${currentStepIndex - 1})">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8 3L4 7l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Previous
               </button>`
            : `<a href="index.html" class="btn btn-outline">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M8 3L4 7l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Back to Start
               </a>`
          }
        </div>
        <div class="step-nav-center">
          ${currentStepIndex + 1} / ${steps.length}
        </div>
        <div>
          ${nextStep
            ? `<button class="btn btn-primary" onclick="goNext()">
                Next
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M6 3l4 4-4 4" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
               </button>`
            : `<button class="btn btn-success" onclick="goNext()">
                Finish Journey
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 7l3.5 3.5 6-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
               </button>`
          }
        </div>
      </div>

    `;

    // Update sidebar highlight
    document.querySelectorAll(".sidebar-step").forEach((el, i) => {
      el.classList.toggle("active", i === currentStepIndex);
    });

    // Scroll to top of main
    document.getElementById("journey-main").scrollTop = 0;
    window.scrollTo(0, 0);

    // Track analytics
    SPE_ANALYTICS.trackStepViewed(persona, currentStepIndex, step);

    // Update URL without reload
    const url = new URL(window.location);
    url.searchParams.set("step", currentStepIndex);
    history.replaceState({}, "", url);
  }

  function renderCompletion() {
    const resourceLinks = [
      { label: "Microsoft Learn: SPE Docs", url: "https://learn.microsoft.com/en-us/sharepoint/dev/embedded/overview" },
      { label: "Learning Module: Overview", url: "https://learn.microsoft.com/en-us/training/modules/sharepoint-embedded-setup/" },
      { label: "Learning Module: Build Apps", url: "https://learn.microsoft.com/en-us/training/modules/sharepoint-embedded-create-app/" }
    ];

    document.getElementById("step-content").innerHTML = `
      <div class="completion-screen">
        <div class="completion-icon">🎉</div>
        <h1 class="completion-title">Journey Complete!</h1>
        <p class="completion-sub">
          You've completed the <strong>${journey.title}</strong> journey for SharePoint Embedded.
          <br>All ${steps.length} steps finished.
        </p>
        <div class="completion-links">
          <a href="index.html" class="btn btn-primary">Start Another Journey</a>
        </div>
        <div style="margin-top:40px;text-align:left;max-width:480px;margin-inline:auto">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px">Continue Learning</div>
          ${resourceLinks.map(r => `
            <a href="${r.url}" target="_blank" rel="noopener"
               style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:8px;font-size:14px;color:var(--text-primary);background:#fff">
              ${r.label}
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 3h8v8M3 11L11 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </a>`).join("")}
        </div>
      </div>`;

    SPE_ANALYTICS.trackJourneyCompleted(persona, steps.length);
  }

  // ── Actions ───────────────────────────────────────────────────────────────
  function navigateTo(index) {
    currentStepIndex = index;
    renderSidebar();
    renderStep();
    updateProgressBar();
  }

  function markComplete() {
    const step = steps[currentStepIndex];
    completedSteps.add(step.id);
    saveProgress(completedSteps);
    SPE_ANALYTICS.trackStepCompleted(persona, currentStepIndex, step);
    renderSidebar();
    updateProgressBar();
    renderStep();
    // Auto-advance after a short delay
    setTimeout(() => navigateTo(currentStepIndex + 1), 800);
  }

  function goNext() {
    if (currentStepIndex < steps.length - 1) {
      navigateTo(currentStepIndex + 1);
    } else {
      renderCompletion();
    }
  }

  function onDocOpen() {
    const step = steps[currentStepIndex];
    SPE_ANALYTICS.trackDocOpened(persona, currentStepIndex, step);
  }

  function copyLink() {
    const step = steps[currentStepIndex];
    navigator.clipboard.writeText(step.url).then(() => {
      alert("Document URL copied to clipboard!");
    });
  }

  // ── Resume from URL step param ────────────────────────────────────────────
  const stepParam = parseInt(params.get("step") || "0", 10);
  if (!isNaN(stepParam) && stepParam >= 0 && stepParam < steps.length) {
    currentStepIndex = stepParam;
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  SPE_ANALYTICS.initAlloy();
  SPE_ANALYTICS.trackPageView(persona);
  SPE_ANALYTICS.trackJourneyStarted(persona);

  renderSidebar();
  renderStep();
  updateProgressBar();
</script>
</body>
</html>
